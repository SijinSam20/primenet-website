<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeNet OG</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: linear-gradient(135deg, #0b1120 0%, #0f172a 60%, #111827 100%); font-family: 'Inter', sans-serif; overflow: hidden; position: relative; }
  .mesh { position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(6,182,212,0.18) 0%, transparent 50%), radial-gradient(circle at 70% 80%, rgba(139,92,246,0.15) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(52,211,153,0.08) 0%, transparent 60%); }
  .grain { position: absolute; inset: 0; opacity: 0.35; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); background-size: 256px 256px; }
  .content { position: relative; z-index: 10; width: 1200px; height: 630px; display: flex; align-items: center; justify-content: space-between; padding: 70px 90px; }
  .left { max-width: 680px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); padding: 8px 18px; border-radius: 999px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 28px; backdrop-filter: blur(6px); }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; animation: pulse 2s infinite; }
  h1 { font-family: 'Poppins', sans-serif; font-weight: 900; color: #fff; font-size: 64px; line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 20px; }
  h1 .cyan { background: linear-gradient(to right, #06b6d4, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: #94a3b8; font-size: 22px; line-height: 1.4; max-width: 520px; }
  .logo-area { display: flex; align-items: center; gap: 18px; margin-top: 36px; }
  .logo-box { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); display: flex; align-items: center; justify-center; box-shadow: 0 0 30px rgba(6,182,212,0.35); }
  .logo-box span { color: #fff; font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 26px; letter-spacing: -0.05em; }
  .logo-text h3 { font-family: 'Poppins', sans-serif; font-weight: 700; color: #fff; font-size: 22px; letter-spacing: -0.02em; margin-bottom: 2px; }
  .logo-text span { color: #06b6d4; font-size: 13px; letter-spacing: 0.06em; font-weight: 600; }
  .right-visual { width: 380px; height: 380px; border-radius: 50%; background: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(139,92,246,0.08)); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-center; position: relative; box-shadow: 0 0 80px rgba(6,182,212,0.12); }
  .orbit-ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(6,182,212,0.2); animation: spin 20s linear infinite; }
  .orbit-ring:nth-child(1) { width: 280px; height: 280px; border-color: rgba(52,211,153,0.3); animation-duration: 15s; animation-direction: reverse; }
  .orbit-ring:nth-child(2) { width: 340px; height: 340px; border-color: rgba(139,92,246,0.2); animation-duration: 25s; }
  .dot-center { width: 16px; height: 16px; border-radius: 50%; background: #34d399; box-shadow: 0 0 20px #34d399; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="mesh"></div>
  <div class="grain"></div>
  <div class="content">
    <div class="left">
      <div class="badge"><span class="dot"></span> UAE Technology Integrator</div>
      <h1>Enterprise Networking, Security & IT <span class="cyan">Infrastructure.</span></h1>
      <p class="sub">Designed, deployed and maintained from Sharjah — SIRA-compliant security, biometrics, servers and full maintenance contracts across the UAE.</p>
      <div class="logo-area">
        <div class="logo-box"><span>PNS</span></div>
        <div class="logo-text"><h3>PrimeNet Solutions FZC</h3><span>Sharjah, UAE · SPC FZC</span></div>
      </div>
    </div>
    <div class="right-visual">
      <div class="orbit-ring"></div>
      <div class="orbit-ring"></div>
      <div class="dot-center"></div>
    </div>
  </div>
</body>
</html>
